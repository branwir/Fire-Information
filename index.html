<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peta Hotspot untuk Tim Lapangan</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#10151c;--panel:#18202b;--line:#2c3a4a;--text:#eaf0f6;--mute:#93a4b6}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:17px;flex:1 1 auto}
header small{display:block;color:var(--mute);font-size:12px;font-weight:400}
button{background:#25364a;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:14px}
button:active{background:#33506f}
main{flex:1;display:flex;flex-direction:column;min-height:0}
#map{flex:1;min-height:0}
#list{height:38%;overflow:auto;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom)}
.it{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:flex-start}
.it:active{background:#223044}
.dot{width:14px;height:14px;border-radius:50%;margin-top:3px;flex:none}
.it b{font-size:15px}.it span{display:block;color:var(--mute);font-size:13px;line-height:1.4}
.cl{display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid #fff;color:#fff;font-weight:700;box-shadow:0 0 0 3px #0006}
.pop{font-size:14px;line-height:1.5;min-width:220px}
.pop h3{font-size:15px;margin-bottom:2px}
.pop .k{font-size:16px;font-weight:700;margin:4px 0}
.pop a,.pop button{display:inline-block;margin:6px 6px 0 0;padding:8px 10px;border-radius:6px;background:#1a73e8;color:#fff;text-decoration:none;border:0;font-size:14px}
.pop button{background:#455a64}
.pts{font-size:13px;line-height:1.55;max-height:150px;overflow:auto;margin-top:2px;font-variant-numeric:tabular-nums;color:#333}
.pop ul{margin:6px 0 0 16px;padding:0;font-size:13px;color:#444}
.empty{padding:16px;color:var(--mute)}
@media (min-width:800px){main{flex-direction:row}#list{width:380px;height:auto;border-top:0;border-left:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <h1>Hotspot untuk Tim Lapangan<small id="ket">Memuat...</small></h1>
  <button id="bGPS">Lokasi saya</button>

</header>
<main><div id="map"></div><div id="list"></div></main>

/* ---------- Geometri ---------- */
function inside(lon,lat,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[xi,yi]=poly[i],[xj,yj]=poly[j];if((yi>lat)!==(yj>lat)&&lon<(xj-xi)*(lat-yi)/(yj-yi)+xi)c=!c}return c}
const distrikDari=(lon,lat)=>CONFIG.DISTRIK.find(d=>d.rings.some(r=>inside(lon,lat,r)));
/* Jarak (meter) titik ke batas konsesi terdekat; 0 jika berada di dalam */
function jarakKePoligon(lon,lat){
  let best=Infinity,kode=null;const k=Math.cos(lat*Math.PI/180)*111320;
  for(const d of CONFIG.DISTRIK)for(const r of d.rings){
    if(inside(lon,lat,r))return {m:0,kode:d.kode};
    for(let i=0,j=r.length-1;i<r.length;j=i++){
      const ax=(r[j][0]-lon)*k,ay=(r[j][1]-lat)*110574,bx=(r[i][0]-lon)*k,by=(r[i][1]-lat)*110574;
      const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;let u=l2?-(ax*dx+ay*dy)/l2:0;u=Math.max(0,Math.min(1,u));
      const dd=Math.hypot(ax+u*dx,ay+u*dy);if(dd<best){best=dd;kode=d.kode}
    }
  }
  return {m:best,kode};
}
function jarak(a,b){const R=6371000,t=Math.PI/180,dl=(b.lat-a.lat)*t,dn=(b.lon-a.lon)*t;
  const x=Math.sin(dl/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const allPts=CONFIG.DISTRIK.flatMap(d=>d.rings.flat());
const BBOX=[Math.min(...allPts.map(p=>p[0])),Math.min(...allPts.map(p=>p[1])),Math.max(...allPts.map(p=>p[0])),Math.max(...allPts.map(p=>p[1]))];

/* ---------- Data hotspot FIRMS (lewat Apps Script) ---------- */
function demo(){
  const out=[],now=Date.now(),ks=Object.keys(SAT);
  for(let k=0;k<6;k++){const d=CONFIG.DISTRIK[k%4],r=d.rings[0],v=r[Math.floor(Math.random()*r.length)];
    const lat0=v[1]+(Math.random()-.5)*.05,lon0=v[0]+(Math.random()-.5)*.05;
    if(!distrikDari(lon0,lat0))continue;const t0=now-Math.random()*10*36e5;
    for(let m=0;m<1+Math.floor(Math.random()*4);m++)out.push({lat:lat0+(Math.random()-.5)*.012,lon:lon0+(Math.random()-.5)*.012,time:new Date(t0+m*36e5/4),conf:'n',sat:ks[m%4],frp:5})}
  return {pts:out,gagal:[]};
}
async function ambil(){
  if(!CONFIG.API_URL)return demo();
  const d=await ambilApi(CONFIG.API_URL+'?aksi=hotspot',45000);
  if(d.err)throw new Error(d.err);
  const seen=new Set();
  const pts=(d.pts||[]).map(r=>{let c=String(r[3]).toLowerCase();if(/^\d+$/.test(c)){const n=+c;c=n<30?'l':n<80?'n':'h'}
    return {lat:+r[0],lon:+r[1],time:new Date(r[2]),conf:c,sat:r[4],frp:0}})
    .filter(h=>{const k=h.sat+h.time.getTime()+h.lat.toFixed(3)+h.lon.toFixed(3);if(seen.has(k))return false;seen.add(k);return true});
  return {pts,gagal:d.gagal||[]};
}

/* ---------- OroraTech (input manual lewat sheet ORORA) ---------- */
function jsonp(url,ms){
  return new Promise((res,rej)=>{
    const cb='cb'+Date.now(),s=document.createElement('script');
    const end=()=>{clearTimeout(to);delete window[cb];s.remove()};
    const to=setTimeout(()=>{end();rej(new Error('Apps Script tidak merespons (periksa izin dan deploy)'))},ms||15000);
    window[cb]=d=>{end();res(d)};s.onerror=()=>{end();rej(new Error('Apps Script gagal dimuat'))};
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;document.head.appendChild(s);
  });
}
/* Dua jalur: tag skrip (JSONP) lebih dulu, lalu fetch biasa sebagai cadangan (sebagian peramban HP memblokir salah satunya) */
async function ambilApi(url,ms){
  try{return await jsonp(url,ms)}
  catch(e1){
    try{
      const r=await fetch(url,{cache:'no-store',credentials:'omit'});
      return JSON.parse(await r.text());
    }catch(e2){throw new Error(e1.message+' | fetch: '+(e2.message||e2))}
  }
}
async function ambilOrora(){
  if(!CONFIG.API_URL)return [];
  const d=await ambilApi(CONFIG.API_URL);
  return (d.orora||[]).map(o=>({lat:+o.lat,lon:+o.lon,time:new Date(o.t),cat:o.cat||'',conf:'h',sat:'ORORA',frp:0,orora:true}));
}

/* ---------- Klaster ---------- */
function kodeUmum(m){const c={};m.forEach(x=>{if(x.kode)c[x.kode]=(c[x.kode]||0)+1});return Object.keys(c).sort((a,b)=>c[b]-c[a])[0]||'-'}
const judul=c=>`${c.n} titik | ${c.kode}${c.luar?' (luar batas ±'+c.jarakKm+' km)':''}`;
function buatKlaster(pts){
  const p=pts.map((_,i)=>i),f=i=>p[i]===i?i:(p[i]=f(p[i]));
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++)if(jarak(pts[i],pts[j])<=CONFIG.KLASTER_METER)p[f(j)]=f(i);
  const g={};pts.forEach((x,i)=>(g[f(i)]=g[f(i)]||[]).push(x));
  return Object.values(g).map(m=>{
    const lat=m.reduce((a,x)=>a+x.lat,0)/m.length,lon=m.reduce((a,x)=>a+x.lon,0)/m.length;
    const t=m.map(x=>+x.time);
    return {m,lat,lon,n:m.length,orora:m.some(x=>x.orora),tMin:Math.min(...t),tMax:Math.max(...t),kode:kodeUmum(m),luar:m.every(x=>x.luar),jarakKm:(Math.min(...m.map(x=>x.dm||0))/1000).toFixed(1),
      sats:[...new Set(m.map(x=>SAT[x.sat]||'demo'))]};
  }).sort((a,b)=>b.tMax-a.tMax);
}

/* ---------- Tampilan ---------- */
let klaster=[],saya=null,sayaMarker=null;
const warna=c=>{const u=(Date.now()-c.tMax)/36e5;return u<6?'#e53935':u<24?'#fb8c00':'#fdd835'};
const jamStr=t=>new Date(t).toLocaleString('id-ID',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
function umur(t){const m=Math.round((Date.now()-t)/6e4);return m<60?m+' menit lalu':Math.floor(m/60)+' jam '+(m%60)+' mnt lalu'}
const koor=c=>c.lat.toFixed(5)+', '+c.lon.toFixed(5);
const jrk=c=>saya?(jarak(saya,c)/1000).toFixed(1)+' km dari Anda':'';
function salinTeks(t){
  const cadangan=()=>{const a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity=0;document.body.appendChild(a);a.select();
    try{document.execCommand('copy');alert('Koordinat disalin')}catch(e){prompt('Salin koordinat:',t)}a.remove()};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(()=>alert('Koordinat disalin'),cadangan);else cadangan();
}
const titikBaris=c=>c.m.slice().sort((a,b)=>b.time-a.time).map((x,i)=>`${i+1}. ${x.lat.toFixed(5)}, ${x.lon.toFixed(5)} | ${jamSaja(x.time)} | ${SAT[x.sat]||'demo'}${x.cat?' | '+x.cat:''}`);
const teksKlaster=c=>`Pusat: ${koor(c)}\n`+titikBaris(c).join('\n');
window.salinKlaster=i=>salinTeks(teksKlaster(klaster[i]));
const jamSaja=x=>new Date(x).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
function banding(c){
  const o=c.m.filter(x=>x.orora);if(!o.length)return '';
  const t0=Math.min(...o.map(x=>+x.time)),f=c.m.filter(x=>!x.orora);
  if(!f.length)return `Orora ${jamSaja(t0)} | FIRMS belum`;
  const tf=Math.min(...f.map(x=>+x.time)),d=Math.round((tf-t0)/6e4),a=Math.abs(d),s=(a>=60?Math.floor(a/60)+' j ':'')+(a%60)+' mnt';
  return `Orora ${jamSaja(t0)} | FIRMS ${jamSaja(tf)} (${s} ${d>=0?'setelah':'sebelum'})`;
}
function popup(c){
  const gm=`https://www.google.com/maps?q=${c.lat},${c.lon}`,nav=`https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lon}`,b=banding(c);
  return `<div class="pop"><h3>${judul(c)}</h3>
    <div>${umur(c.tMax)}${saya?' | '+jrk(c):''}</div>
    ${b?'<div style="color:#7b1fa2;font-weight:600">'+b+'</div>':''}
    <div class="k">Pusat: ${koor(c)}</div>
    <div class="pts">${titikBaris(c).join('<br>')}</div>
    <a href="${nav}" target="_blank">Navigasi</a><a href="${gm}" target="_blank">Buka peta</a><button onclick="salinKlaster(${c.id})">Salin semua</button></div>`;
}
function gambar(){
  lay.clearLayers();
  klaster.forEach(c=>{
    const w=warna(c),s=26+Math.min(c.n,8)*3;
    c.marker=L.marker([c.lat,c.lon],{icon:L.divIcon({className:'',iconSize:[s,s],iconAnchor:[s/2,s/2],html:`<div class="cl" style="width:${s}px;height:${s}px;background:${w};border-color:${c.orora?'#c040ff':'#fff'}">${c.n}</div>`})}).bindPopup(()=>popup(c),{maxWidth:340}).addTo(lay);
    c.m.forEach(x=>L.circleMarker([x.lat,x.lon],{radius:4,color:'#fff',weight:1,fillColor:x.orora?'#c040ff':w,fillOpacity:1}).on('click',()=>c.marker.openPopup()).addTo(lay));
  });
  $('list').innerHTML=klaster.length?klaster.map((c,i)=>`<div class="it" data-i="${i}"><div class="dot" style="background:${warna(c)}"></div><div><b>${judul(c)}</b><span>${koor(c)}</span><span>${umur(c.tMax)} ${saya?' | '+jrk(c):''}</span>${banding(c)?'<span style="color:#d98cff">'+banding(c)+'</span>':''}</div></div>`).join(''):'<div class="empty">Tidak ada hotspot dalam '+CONFIG.JAM_TAMPIL+' jam terakhir di dalam atau sekitar area (±'+CONFIG.BUFFER_KM+' km).</div>';
}
$('list').addEventListener('click',e=>{const it=e.target.closest('.it');if(!it)return;const c=klaster[+it.dataset.i];map.setView([c.lat,c.lon],Math.max(map.getZoom(),14));c.marker.openPopup()});

async function muat(){
  $('ket').textContent='Memuat data...';
  try{
    const [{pts,gagal},oro]=await Promise.all([ambil(),ambilOrora().catch(()=>null)]),now=Date.now();
    const maks=Math.max(CONFIG.JAM_TAMPIL,CONFIG.ORORA_JAM)*36e5;
    const tandai=(x,batas)=>{const r=jarakKePoligon(x.lon,x.lat);x.dm=r.m;x.luar=r.m>0;x.kode=r.m<=batas?r.kode:null;return x};
    const firms=pts.filter(x=>now-x.time<=maks&&!(CONFIG.SEMBUNYIKAN_LOW&&x.conf==='l')).map(x=>tandai(x,CONFIG.BUFFER_KM*1000)).filter(x=>x.dm<=CONFIG.BUFFER_KM*1000);
    const p=firms.concat((oro||[]).filter(x=>now-x.time<=CONFIG.ORORA_JAM*36e5).map(x=>{const r=jarakKePoligon(x.lon,x.lat);x.dm=r.m;x.luar=r.m>0;x.kode=r.kode;return x}));
    klaster=buatKlaster(p).filter(c=>c.orora||now-c.tMax<=CONFIG.JAM_TAMPIL*36e5);
    const jmlTitik=klaster.reduce((a,c)=>a+c.n,0);
    klaster.forEach((c,i)=>c.id=i);
    gambar();
    $('ket').textContent=`v9 | ${klaster.length} klaster | ${jmlTitik} titik | FIRMS ${pts.length} diterima, ${firms.length} di area | ${new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}`+(CONFIG.API_URL?'':' | DEMO')+(gagal.length?' | sumber gagal: '+gagal.length:'')+(CONFIG.API_URL?(oro===null?' | OroraTech gagal dimuat':' | OroraTech: '+oro.length+' titik'):'');
  }catch(e){
    $('ket').textContent='v9 | Gagal memuat: '+e.message+' ';
    if(CONFIG.API_URL){const l=document.createElement('a');l.href=CONFIG.API_URL+'?aksi=hotspot';l.target='_blank';l.textContent='[uji alamat]';l.style.color='#8ab4f8';$('ket').appendChild(l)}
  }
}
$('bRef').onclick=muat;
$('bGPS').onclick=()=>{
  if(!navigator.geolocation)return alert('Perangkat tidak mendukung lokasi');
  navigator.geolocation.getCurrentPosition(p=>{
    saya={lat:p.coords.latitude,lon:p.coords.longitude};
    if(sayaMarker)map.removeLayer(sayaMarker);
    sayaMarker=L.circleMarker([saya.lat,saya.lon],{radius:8,color:'#fff',weight:3,fillColor:'#1a73e8',fillOpacity:1}).addTo(map);
    gambar();map.setView([saya.lat,saya.lon],Math.max(map.getZoom(),12));
  },()=>alert('Lokasi tidak bisa diambil. Izinkan akses lokasi di peramban.'),{enableHighAccuracy:true,timeout:15000});
};
muat();setInterval(muat,CONFIG.REFRESH_MIN*60000);
</script>
